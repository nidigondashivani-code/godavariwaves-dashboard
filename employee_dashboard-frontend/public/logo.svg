<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gwGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="100" height="100" rx="24" fill="url(#gwGradient)" />

  <!-- Outer Ring Accent -->
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Wave 1 (Deep Dynamic Flow) -->
  <path d="M18 68 C30 52, 44 74, 58 56 C70 42, 78 50, 84 46" 
        stroke="url(#wave1)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.8" />

  <!-- Wave 2 (Main Crisp Crest) -->
  <path d="M16 48 C28 28, 44 58, 60 38 C72 24, 78 34, 82 28" 
        stroke="url(#wave2)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Floating Digital Accent Nodes -->
  <circle cx="82" cy="28" r="4.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="50" cy="74" r="3" fill="#93C5FD" opacity="0.9" />
  <circle cx="22" cy="30" r="2.5" fill="#BAE6FD" opacity="0.7" />
</svg>
